<!doctype html><html lang="en"><head><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#c2410c"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="IELTS Coach"><link rel="apple-touch-icon" href="icons/icon-192.png"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>IELTS Coach</title>
<style>
:root{--bg:#faf8f5;--fg:#1f2430;--mut:#6a6f7a;--card:#fff;--bd:#e3ded6;--ac:#c2410c;--ok:#15803d;--bad:#b91c1c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

:root[data-theme="dark"]{color-scheme:dark;--bg:#15171c;--fg:#ece9e3;--mut:#9a9fa9;--card:#1f222a;--bd:#33373f;--ac:#fb923c;--ok:#4ade80;--bad:#f87171}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0}h2{font-size:18px;margin:0 0 8px}
.sub{color:var(--mut);font-size:14px}
nav{display:flex;gap:6px;overflow-x:auto;margin:12px 0;padding-bottom:4px}
nav button,.btn{border:1px solid var(--bd);background:var(--card);color:var(--fg);padding:8px 14px;border-radius:999px;font:inherit;cursor:pointer;white-space:nowrap;transition:transform .1s}
.btn:active,.opt:active{transform:scale(.97)}
nav button.on,.btn.pri{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:10px 0;animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
select,textarea,input[type=date],input[type=time]{width:100%;font:inherit;padding:8px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--fg);box-sizing:border-box}
textarea{min-height:170px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1;min-width:130px}

.opt.sel{border-color:var(--ac)}.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,transparent)}.opt.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 16%,transparent)}
.bar{height:10px;background:var(--bd);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac);transition:width .4s}
.big{font-size:32px;font-weight:700;color:var(--ac)}
.tag,.chip{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;border:1px solid var(--bd);color:var(--mut)}
.chip.on{color:var(--ok);border-color:var(--ok)}
label.ck{display:flex;gap:10px;align-items:center;padding:6px 0}label.ck span{flex:1}
a{color:var(--ac)}.up{color:var(--ok)}.dn{color:var(--bad)}
.pass{white-space:pre-wrap;background:var(--bg);padding:10px;border-radius:10px;border:1px solid var(--bd)}.sm{font-size:14px;margin:6px 0}

</style></head><body><main>
<div class="row" style="gap:4px"><h1>IELTS Coach</h1><div style="text-align:right"><span class="chip" id="sync">…</span></div></div>
<nav id="nav"></nav><div id="v"></div>
<script src="shim.js"></script>
<script>
const $=s=>document.querySelector(s),esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),pick=a=>a[Math.floor(Math.random()*a.length)],shuf=a=>[...a].sort(()=>Math.random()-.5);
let S={stage:0,start:Date.now(),log:[],checks:{},mist:[],lang:'en',help:1,u:0};
const LK='ielts2';try{const r=localStorage.getItem(LK);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
let DB=null,syncT=null,MODE='account';try{MODE=localStorage.getItem('ielts2.mode')||'account'}catch(e){}
let WHY='';
const setSync=(m,why)=>{const e=$('#sync');if(why!==undefined)WHY=why;e.className='chip'+(m=='cloud'?' on':'');e.style.cursor='pointer';e.onclick=()=>{if(m!='cloud'&&m!='device')initSync(1)};e.textContent=m=='cloud'?'☁ Saved to your account':m=='wait'?'Syncing…':m=='device'?'💾 Saved on this device only':'⚠ Not saved to account'+(WHY?' ('+WHY+')':'')+' · tap to retry'};
function save(){S.u=Date.now();S.log=S.log.slice(-500);try{localStorage.setItem(LK,JSON.stringify(S))}catch(e){}if(DB){setSync('wait');clearTimeout(syncT);syncT=setTimeout(push,1200)}}
let PUSHING=false,AGAIN=false;
async function push(n){if(!DB||MODE=='device')return;if(PUSHING){AGAIN=true;return}PUSHING=true;try{await DB.set({u:S.u,state:JSON.stringify(S)});setSync('cloud','')}catch(e){const c=e&&(e.code||e.message)||'error';if(!n&&c=='unavailable'){PUSHING=false;setTimeout(()=>push(1),1500);return}setSync('local',c=='invalid_argument'?'this link or account has no write access':c)}PUSHING=false;if(AGAIN){AGAIN=false;push()}}
async function initSync(){if(MODE=='device'){DB=null;return setSync('device')}try{setSync('wait');const db=await claude.use('db'),us=await claude.use('user');if(!db)return setSync('local','account storage unavailable in this view');if(!us)return setSync('local','user info unavailable');const id=await us.id();if(!id)return setSync('local','please sign in to claude.ai');DB=db.collection('data/users/'+id).doc('progress');const s=await DB.get();if(s.exists){const r=s.data()||{};if((r.u||0)>(S.u||0)){try{S=Object.assign(S,JSON.parse(r.state));localStorage.setItem(LK,JSON.stringify(S))}catch(e){}setSync('cloud','');nav();if(!cur&&!mock)go(tab)}else await push()}else await push()}catch(e){setSync('local',e&&(e.code||e.message)||'error')}}
const today=()=>new Date().toISOString().slice(0,10);
const ST=[
{n:'Stage 1 · Foundation',m:'Months 1–3',c:'A1–A2 (beginner)',b:'about 3.5',f:'Basic grammar (to be, simple tenses), the 800 most common words, pronunciation, simple sentences.'},
{n:'Stage 2 · Solid Basics',m:'Months 4–8',c:'B1 (pre-intermediate)',b:'about 4.5',f:'All main tenses, short paragraphs, everyday listening, 1,500 words.'},
{n:'Stage 3 · Intermediate',m:'Months 9–13',c:'B1+ (intermediate)',b:'about 5.5',f:'Learn the IELTS format, academic vocabulary, 150-word essays, Speaking Part 1.'},
{n:'Stage 4 · Upper-Intermediate',m:'Months 14–18',c:'B2 (upper-intermediate)',b:'about 6.0',f:'Reading strategy (True/False/Not Given), Writing Tasks 1 and 2, Speaking Parts 2–3.'},
{n:'Stage 5 · IELTS Intensive',m:'Months 19–22',c:'B2+ / C1',b:'about 6.5',f:'Timed practice, fixing repeated mistakes, advanced vocabulary, cohesion.'},
{n:'Stage 6 · Test Ready',m:'Months 23–24',c:'C1',b:'7.0',f:'Full mock tests, repair weak spots, exam-day strategy, book your test.'}];
const TOPICS=['education','environment','technology','health','urban life','work and careers','travel and tourism','science','culture and tradition','media and advertising','business and consumer behaviour','sport','food and agriculture','history','housing','energy','language learning','social media','transport','economics'];
const SRC=['BBC-style news article','academic journal summary','magazine feature','university lecture','workplace email thread','public information leaflet','interview transcript','textbook excerpt'];
const SK={reading:'Reading',listening:'Listening',vocab:'Vocabulary',grammar:'Grammar',writing:'Writing',speaking:'Speaking',review:'Mistake review',mock:'Mock test'},SKP=Object.keys(SK).slice(0,6);
const RES=[['British Council · Prepare for IELTS','https://takeielts.britishcouncil.org/take-ielts/prepare','Official materials and sample tests'],['IELTS.org · Sample test questions','https://www.ielts.org/for-test-takers/sample-test-questions','Official sample questions'],['BBC Learning English','https://www.bbc.co.uk/learningenglish','Listening and grammar for every level'],['British Council LearnEnglish','https://learnenglish.britishcouncil.org','Exercises by level, A1–C1'],['VOA Learning English','https://learningenglish.voanews.com','Slow news, great for listening'],['TED Talks','https://www.ted.com/talks','Authentic listening with transcripts'],['Cambridge Dictionary','https://dictionary.cambridge.org','Dictionary with example sentences'],['IDP IELTS Indonesia','https://ielts.idp.com/indonesia','Test dates and registration']];
const INSTR={listening:'Press play, listen (you can replay), then answer. The transcript appears after you submit.',reading:'Read the passage, then answer all questions. Watch the clock.',writing:'Write your answer in English. You will get a band estimate and corrections.',speaking:'Press the microphone and speak your answer (Chrome, Edge or Android Chrome), or type it. Check the text, then get your score.'};
const MOCK={mini:[{sk:'listening',n:6,m:10,len:150},{sk:'reading',n:6,m:20,len:350},{sk:'writing',m:25,w:150},{sk:'speaking',m:6,w:80}],full:[{sk:'listening',n:10,m:30,len:350},{sk:'reading',n:13,m:60,len:650},{sk:'writing',m:60,w:250},{sk:'speaking',m:14,w:150}]};
let tab='today',cur=null,mock=null,busy=false,TM=null,T=0;
const TABS={today:'Today',plan:'My Plan',practice:'Practice',mock:'Mock Test',sample:'Sample Test',review:'Review',prog:'Progress',road:'Roadmap',res:'Sources'};
function nav(){$('#nav').innerHTML=Object.entries(TABS).map(([k,t])=>`<button class="${k==tab?'on':''}" onclick="go('${k}')">${t}${k=='review'&&S.mist.length?' ('+S.mist.length+')':''}</button>`).join('')}
function go(t){if(mock&&cur&&!cur.done&&t!='mock'){alert('Finish or quit the mock test first.');return}if(t!='practice'&&!mock)cur=null;if(t=='practice'&&cur&&(cur.mode!='practice'||cur.fixed||cur.done))cur=null;tab=t;nav();({today:vToday,plan:vPlan,practice:vPractice,mock:vMock,sample:vSample,review:vReview,prog:vProg,road:vRoad,res:vRes})[t]();window.scrollTo(0,0)}
function streak(){const d=new Set([...S.log.map(x=>x.d),...Object.keys(S.checks).filter(k=>S.checks[k].length)]);let n=0,t=new Date();if(!d.has(today()))t.setDate(t.getDate()-1);while(d.has(t.toISOString().slice(0,10))){n++;t.setDate(t.getDate()-1)}return n}
const avg=a=>a.length?Math.round(a.reduce((x,y)=>x+y.sc,0)/a.length):0;
function weak(){const r=SKP.map(k=>({k,a:S.log.filter(x=>x.sk==k)})).filter(r=>r.a.length);return r.length?r.sort((x,y)=>avg(x.a.slice(-5))-avg(y.a.slice(-5)))[0].k:pick(SKP)}
function vToday(){const t=today(),c=S.checks[t]||[],w=new Date().getDay()%2,st=ST[S.stage],mo=Math.floor((Date.now()-(S.plan?S.plan.start:S.start))/6048e5)+1,TW=S.plan?S.plan.weeks:104;
const P0=[['Vocabulary · 10 min','vocab'],['Listening · 15 min','listening'],['Reading · 15 min','reading'],w?['Writing · 20 min','writing']:['Speaking · 10 min','speaking'],['Grammar · 10 min','grammar'],['Mistake review · 10 min','review'],[S.stage>=3?'Watch or read real English for 15 min (BBC, TED)':'Listen to English songs or videos for 15 min',0]];
const P=todayPlan(w,P0);$('#v').innerHTML=(S.plan?'':`<div class="card" style="border-color:var(--ac)"><b>🎯 Build your own study plan</b><div class="sub">Choose your target band, how long you have, and your daily time.</div><p><button class="btn pri" onclick="go('plan')">Create my plan</button></p></div>`)+(c.length||S.log.some(x=>x.d==t)?'':`<div class="card" style="border-color:var(--ac)">⏰ <b>You haven’t studied yet today.</b> Ten minutes is enough to keep your streak.</div>`)+(S.help?`<div class="card"><h2>👋 How it works</h2><ol class="sub" style="padding-left:18px;margin:0 0 8px"><li><b>Today:</b> tick off the daily plan. Press Start to open an exercise.</li><li><b>Practice:</b> unlimited fresh exercises. You get instant feedback on every answer.</li><li><b>Mock Test:</b> timed exam simulation with an estimated band score.</li><li><b>Review:</b> questions you got wrong come back here until you master them.</li><li><b>Progress:</b> track your scores. Use Export in Settings to back up your data.</li></ol><button class="btn" onclick="S.help=0;save();vToday()">Got it, hide</button></div>`:'')+
`<div class="card"><div class="row"><div><div class="sub">Study streak</div><div class="big">${streak()} days</div></div><div><div class="sub">Week</div><div class="big">${Math.min(mo,TW)}/${TW}</div></div><div><div class="sub">Mistakes to review</div><div class="big">${S.mist.length}</div></div></div><div class="bar"><i style="width:${Math.min(100,mo/TW*100)}%"></i></div></div>
<div class="card"><h2>${esc(st.n)}</h2><div class="sub">${esc(st.c)} · target band ${st.b}</div><p>${esc(st.f)}</p><button class="btn pri" onclick="go('practice');gen('smart')">⚡ Smart practice (your weakest skill)</button></div>
<div class="card"><h2>Today’s plan (about ${(S.plan||{}).mins||75} min)</h2><div class="sub">Tick each task when you finish it.</div>${P.map((p,i)=>`<label class="ck"><input type="checkbox" ${c.includes(i)?'checked':''} onchange="chk(${i},this.checked)"><span>${esc(p[0])}</span>${p[1]?`<button class="btn" onclick="${p[1]=='review'?"go('review')":`quick('${p[1]}')`}">Start</button>`:''}</label>`).join('')}</div>
${examCard()}<div class="card"><h2>Settings</h2><div class="sub">AI connection (optional)</div><div class="sub">Without a key the app uses the daily question bank. With a free Google AI Studio key you also get fresh questions and Writing/Speaking scoring. The key is stored only on this device. ${localStorage.getItem('ielts_gemini_key')?'✓ A key is saved.':''}</div><p><input id="gk" type="password" placeholder="Gemini API key" autocomplete="off" style="width:100%;font:inherit;padding:8px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--fg);box-sizing:border-box;margin-bottom:6px"><input id="gm" type="text" placeholder="Model name (default gemini-2.5-flash)" value="${esc(localStorage.getItem('ielts_model')||'')}" style="width:100%;font:inherit;padding:8px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--fg);box-sizing:border-box"></p><p><button class="btn pri" onclick="saveAI()">Save AI settings</button></p><div class="sub" style="margin-top:8px">Your progress is saved on this device. Back it up or move it to another device:</div><p><button class="btn" onclick="exportData()">⬇ Export progress</button> <button class="btn" onclick="importData()">⬆ Import progress</button></p><div class="sub" style="margin-top:12px">Language of explanations after each answer</div><p><button class="btn ${S.lang=='en'?'pri':''}" onclick="S.lang='en';save();vToday()">Simple English</button> <button class="btn ${S.lang=='id'?'pri':''}" onclick="S.lang='id';save();vToday()">Bahasa Indonesia</button></p><button class="btn" style="color:var(--bad);border-color:var(--bad)" onclick="resetAll()">🗑 Reset all progress</button></div>`}
function chk(i,on){const t=today(),a=new Set(S.checks[t]||[]);on?a.add(i):a.delete(i);S.checks[t]=[...a];save()}
function quick(sk){go('practice');$('#sk').value=sk;gen()}
function vPractice(){if(cur)return renderQ();
$('#v').innerHTML=`<div class="card"><h2>Practice generator</h2><div class="sub">Choose a skill and level, then press Create. Every exercise is new: random topic, random source style. Tap an answer to see instantly if you are right.</div><div class="row" style="margin-top:10px"><select id="sk">${SKP.map(k=>`<option value="${k}">${SK[k]}</option>`).join('')}</select><select id="lv">${ST.map((s,i)=>`<option value="${i}" ${i==S.stage?'selected':''}>${esc(s.n)}</option>`).join('')}</select></div><p><button class="btn pri" onclick="gen()">Create exercise</button> <button class="btn" onclick="gen('smart')">⚡ Smart pick</button> <button class="btn" onclick="gen('rand')">🎲 Surprise me</button></p><div id="st" class="sub"></div></div>`}
const say2=t=>{const e=$('#st');if(e)e.textContent=t};
function mkP(sk,lv,topic,src,n,len,words){const H=`You are an expert IELTS examiner and English tutor. Learner level: ${lv.c}, target IELTS band ${lv.b}. Topic: ${topic}. Source style: ${src}. Variation seed: ${Math.random()}. Return ONLY valid JSON, no markdown. Exercise content in English; explanations ("why") in ${S.lang=='id'?'Indonesian':'simple English'}.`,M='{"title":"..","text":"..","questions":[{"q":"..","options":["..",".."],"answer":0,"why":".."}]}';
return{reading:`${H} Write a reading passage of about ${len||250} words in "text", then ${n} questions mixing 4-option multiple choice and True/False/Not Given (options exactly ["True","False","Not Given"]). Schema: ${M}`,
listening:`${H} Write a spoken script (monologue or dialogue, about ${len||180} words, natural speech) in "text", then ${n} multiple-choice detail questions. Schema: ${M}`,
vocab:`${H} Create ${n>6?n:8} vocabulary questions (word in context, synonyms, collocations) for this level; "text" is a one-line instruction. Schema: ${M}`,
grammar:`${H} Create ${n>6?n:8} grammar questions (error choice, tense, articles, prepositions, structure) for this level; "text" is a one-line instruction. Schema: ${M}`,
writing:`${H} Create one IELTS-style writing task for this level (simple sentences for beginners, Task 2 essay for B2+). Schema: {"title":"..","text":"task prompt","words":${words||150}}`,
speaking:`${H} Create one IELTS speaking task for this level (Part 1 questions for low levels, Part 2 cue card plus two follow-ups for B2+). Schema: {"title":"..","text":"prompt","words":${words||80}}`}[sk]}
async function load(sk,o){if(busy)return false;let sample=null;try{sample=await claude.use('sample')}catch(e){}
if(!sample){say2('The exercise generator is not available here. Please open this page on claude.ai.');return false}
busy=true;say2('Creating your '+SK[sk]+' exercise…');const lv=ST[o.lv],topic=pick(TOPICS);
try{const d=await sample.json(mkP(sk,lv,topic,pick(SRC),o.n||6,o.len,o.w),{cache:false});
if(sk!='writing'&&sk!='speaking'){if(!d||typeof d!='object')throw{};d.questions=(Array.isArray(d.questions)?d.questions:[]).filter(q=>q&&Array.isArray(q.options)&&q.options.length>1&&Number.isInteger(q.answer)&&q.answer>=0&&q.answer<q.options.length).map(q=>mixQ({...q,q:String(q.q??''),why:String(q.why??''),options:q.options.map(o=>String(o??''))}));if(!d.questions.length)throw{}}
if(!d||typeof d!='object')throw{};cur={sk,d,a:{},lock:{},lv:o.lv,topic,mode:o.mode};busy=false;renderQ();return true}catch(e){busy=false;say2('Could not create the exercise ('+(e.code||'error')+'). Please try again.');return false}}
async function gen(m){const sk=m=='smart'?weak():m=='rand'?pick(SKP):$('#sk').value,lv=m&&$('#lv')?+$('#lv').value:$('#lv')?+$('#lv').value:S.stage;await load(sk,{mode:'practice',lv:lv??S.stage})}
function renderQ(){const{sk,d}=cur,prod=sk=='writing'||sk=='speaking',mk=cur.mode=='mock',Q=d.questions||[];
let h=mk?`<div class="stick"><span class="sub">${SK[sk]} · Section ${mock.i+1}/${MOCK[mock.m].length}</span><span id="tm"></span></div>`:'';
h+=`<div class="card"><span class="tag">${SK[sk]}</span> <span class="tag">${esc(cur.topic)}</span><h2 style="margin-top:8px">${esc(d.title)}</h2>`;
if(sk=='listening')h+=`<p><button class="btn pri" onclick="speak(.9)">▶ Play</button> <button class="btn" onclick="speak(.7)">🐢 Slow</button> <button class="btn" onclick="speechSynthesis.cancel()">■ Stop</button></p><div class="sub">${INSTR.listening}</div>`;
else if(sk!='review'&&d.text)h+=`<div class="pass">${esc(d.text)}</div>`;
if(prod)h+=`<div class="sub" style="margin-top:6px">${INSTR[sk]}</div>`;
h+='</div>';
if(prod){h+=`<div class="card"><textarea id="ans" placeholder="Write your answer in English (aim for about ${d.words||100} words)…" oninput="wc()"></textarea><div class="sub" id="wc">0 words</div>${sk=='speaking'?'<div class="sub" id="part"></div><p><button class="btn" id="mic" onclick="mic()">🎤 Speak</button> <button class="btn" onclick="prep()">⏱ 1-min prep</button></p>':''}<p><button class="btn pri" id="eb" onclick="evalP()">Get my score</button> ${mk?'':`<button class="btn" onclick="cur=null;go('practice')">Cancel</button>`}</p><div id="fb"></div></div>`}
else{const n=Object.keys(cur.a).length;h+=`<div class="bar"><i style="width:${n/Q.length*100}%"></i></div><div class="sub">${n}/${Q.length} answered</div>`;
Q.forEach((q,i)=>{const L=cur.lock[i]||cur.done;h+=`<div class="card"><b>${i+1}. ${esc(q.q)}</b>${q.t&&cur.mode=='review'?`<div class="pass sm">${esc(q.t)}</div>`:''}${q.options.map((o,j)=>`<button class="opt ${L&&j==q.answer?'ok':L&&cur.a[i]==j?'no':!L&&cur.a[i]==j?'sel':''}" ${L?'disabled':''} onclick="ans(${i},${j})">${esc(o)}</button>`).join('')}${(L&&!mk)||cur.done?`<div class="sub">💡 ${esc(q.why)}</div>`:''}</div>`});
if(cur.done)h+=`<div class="card" id="res" style="border-color:var(--ac)"><h2>Your result</h2><div class="big">${cur.sc}%</div><div>${cur.msg}</div>${sk=='listening'?`<p class="sub">Transcript:</p><div class="pass">${esc(d.text)}</div>`:''}<p>${mk?`<button class="btn pri" onclick="nextSec()">Continue →</button>`:`<button class="btn pri" onclick="again()">Next exercise →</button> <button class="btn" onclick="go('prog')">See progress</button>`}</p></div>`;
else if(mk||n==Q.length)h+=`<p><button class="btn pri" onclick="fin()">${mk?'Submit section':'See results'}</button></p>`}
$('#v').innerHTML=h;tick()}
function tick(){const e=$('#tm');if(e){e.textContent=Math.floor(T/60)+':'+String(T%60).padStart(2,'0');e.style.color=T<60?'var(--bad)':''}}
function timer(sec,cb){clearInterval(TM);T=sec;tick();TM=setInterval(()=>{T--;tick();if(T<=0){clearInterval(TM);cb()}},1000)}
function speak(r){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(cur.d.text);u.lang='en-GB';u.rate=r;speechSynthesis.speak(u)}catch(e){alert('Audio is not supported in this browser.')}}
function ans(i,j){if(cur.done)return;if(cur.mode!='mock'){if(cur.lock[i])return;cur.lock[i]=1}cur.a[i]=j;renderQ()}

function planCalc(o){const wk=Math.max(1,Math.round(o.months*4.345));let last=STB.findIndex(b=>b>=o.band);if(last<0)last=5;last=Math.max(last,o.stage);const ix=[];for(let i=o.stage;i<=last;i++)ix.push(i);const tw=ix.reduce((a,i)=>a+STW[i],0),al=ix.map(i=>({stage:i,weeks:Math.max(1,Math.round(wk*STW[i]/tw))}));const sum=al.reduce((a,x)=>a+x.weeks,0);al[al.length-1].weeks=Math.max(1,al[al.length-1].weeks+wk-sum);return al}
function planRange(i){const p=S.plan;if(!p)return 'about '+STW[i]+' months';let c=0;for(const a of p.alloc){const f=c+1;c+=a.weeks;if(a.stage==i)return f==c?'Week '+f:'Weeks '+f+'–'+c}return i<p.alloc[0].stage?'Already covered':'Beyond your target'}
function todayPlan(w,P0){const pl=S.plan;if(!pl)return P0;if((new Date().getDay()+6)%7>=pl.days)return[['Rest day: 10-minute light review',S.mist.length?'review':0],['Optional: listen to English for 15 min',0]];const base=['vocab','listening','reading',w?'writing':'speaking','grammar',w?'speaking':'writing'],pri=[...(pl.focus||[]),...base].filter((k,i,a)=>a.indexOf(k)==i),rev=S.mist.length?10:0,imm=pl.mins>=60?15:0,rest=pl.mins-rev-imm,n=Math.max(2,Math.min(6,Math.floor(rest/12))),each=Math.max(10,Math.round(rest/n/5)*5),out=pri.slice(0,n).map(k=>[SK[k]+' · '+each+' min',k]);if(rev)out.push(['Mistake review · '+rev+' min','review']);if(imm)out.push([(S.stage>=3?'Watch or read real English':'Listen to English songs or videos')+' · '+imm+' min',0]);return out}
function pf(k,v){if(k=='focus'){const f=PF.focus;f.includes(v)?f.splice(f.indexOf(v),1):f.push(v)}else PF[k]=+v;vPlan()}
function vPlan(){const p=S.plan;PF=PF||{months:p?p.months:12,band:p?p.band:6.5,mins:p?p.mins:60,days:p?p.days:5,focus:p?[...p.focus]:[],stage:S.stage};
const al=planCalc(PF),wk=al.reduce((a,x)=>a+x.weeks,0),hrs=Math.round(wk*PF.days*PF.mins/60);let c=0;const rows=al.map(a=>{const f=c+1;c+=a.weeks;return{...a,r:f==c?'Week '+f:'Weeks '+f+'–'+c}});
const sel=(id,arr,v,fmt)=>`<select onchange="pf('${id}',this.value)">${arr.map(x=>`<option value="${x}" ${x==v?'selected':''}>${fmt?fmt(x):x}</option>`).join('')}</select>`,lb=t=>`<p class="sub" style="margin:12px 0 2px">${t}</p>`;
$('#v').innerHTML=`<div class="card"><h2>Build your study plan</h2><div class="sub">Tell us your goal and how much time you have. Change anything and the plan updates instantly. Not sure of your level? Try a Sample Test or a Mini Mock Test first.</div>${lb('Your current level')}<select onchange="pf('stage',this.value)">${ST.map((s,i)=>`<option value="${i}" ${i==PF.stage?'selected':''}>${esc(s.n.split(' · ')[1])} (${esc(s.c)})</option>`).join('')}</select>${lb('Target IELTS band')}${sel('band',[5,5.5,6,6.5,7,7.5,8],PF.band)}${lb('Time you have until your goal')}${sel('months',[1,2,3,6,9,12,18,24,36],PF.months,m=>m+(m==1?' month':' months'))}${lb('Study time per day')}${sel('mins',[20,30,45,60,75,90,120],PF.mins,m=>m+' minutes')}${lb('Study days per week')}${sel('days',[3,4,5,6,7],PF.days,d=>d+' days')}${lb('Skills to prioritise (optional, tap to select)')}<div class="row" style="gap:6px">${SKP.map(k=>`<button class="btn ${PF.focus.includes(k)?'pri':''}" style="flex:0 0 auto;min-width:0" onclick="pf('focus','${k}')">${SK[k]}</button>`).join('')}</div></div>
<div class="card"><h2>Your plan preview</h2><p><span class="big">${wk}</span> weeks · about <b>${hrs}</b> study hours (${PF.days} days × ${PF.mins} min per week)</p>${rows.map(a=>`<div class="row" style="gap:4px;margin:6px 0"><div style="flex:3"><b>${esc(ST[a.stage].n)}</b><div class="sub">${esc(ST[a.stage].f)}</div></div><div style="text-align:right">${a.r}<div class="sub">band ${ST[a.stage].b}</div></div></div>`).join('')}<div class="sub">Weekly rhythm: study ${DAYS.slice(0,PF.days).join(', ')}${PF.days<7?'; rest '+DAYS.slice(PF.days).join(', '):''}. ${PF.mins>=60?'Do a Mini Mock Test once a week':'Do a Mini Mock Test every two weeks'}${al[al.length-1].stage>=4?' and a Full Mock Test every month in the final stages.':'.'}${PF.focus.length?' Priority skills come first in your daily checklist: '+PF.focus.map(k=>SK[k]).join(', ')+'.':''}</div><div class="sub" style="margin-top:8px">Reality check: a common rule of thumb is that moving up one proficiency level takes roughly 200 hours of study. If the hours above look low for the distance you want to cover, choose a longer time or more minutes per day. Progress is faster when you also practise speaking with real people.</div><p><button class="btn pri" onclick="startPlan()">${p?'Update my plan':'Start this plan'}</button>${p?' <span class="tag">A plan is active</span>':''}</p></div>`}
function startPlan(){const al=planCalc(PF);S.plan={months:PF.months,band:PF.band,mins:PF.mins,days:PF.days,focus:[...PF.focus],start:Date.now(),weeks:al.reduce((a,x)=>a+x.weeks,0),alloc:al};S.stage=PF.stage;save();PF=null;flash('Plan saved. Your daily checklist now follows it.');go('today')}
